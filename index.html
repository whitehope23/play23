<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업자료 아카이브</title>
<meta name="description" content="Claude로 만든 수업 콘텐츠를 모아 연수 선생님들과 공유하는 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F4F1EA; --card:#FFFDF8; --ink:#1F2A44; --muted:#5B6576; --line:#DDD6C8;
  --accent:#C8402F; --accent-2:#2F5DA8; --on-accent:#FFFFFF; --tag-bg:#ECE6D8;
  --shadow:0 1px 0 rgba(31,42,68,.05), 0 16px 32px -20px rgba(31,42,68,.45);
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171F; --card:#1B2230; --ink:#E7EBF2; --muted:#9AA6B8; --line:#2D3747;
    --accent:#E46F5C; --accent-2:#7DA2E3; --on-accent:#11161E; --tag-bg:#252E3D;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 32px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12171F; --card:#1B2230; --ink:#E7EBF2; --muted:#9AA6B8; --line:#2D3747;
  --accent:#E46F5C; --accent-2:#7DA2E3; --on-accent:#11161E; --tag-bg:#252E3D;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 32px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}

.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--card)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.25rem}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand i svg{width:18px;height:18px;stroke:var(--on-accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.made{font-size:.85rem;color:var(--muted)}

.hero{padding-block:clamp(36px,6vw,64px) clamp(24px,4vw,40px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.hero h1{font-size:clamp(2.4rem,6vw,3.8rem);margin-top:8px}
.hero p{font-size:1.08rem;color:var(--muted);margin:14px 0 0;max-width:34em}
.guide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.guide h2{font-size:1.15rem;margin-bottom:10px}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:g}
.guide li{display:flex;gap:10px;font-size:.95rem;counter-increment:g}
.guide li::before{content:counter(g);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);
  font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:2px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:8px 20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.count{color:var(--muted);font-size:.92rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.band{height:10px;background:repeating-linear-gradient(-45deg,var(--c) 0 14px,var(--card) 14px 20px)}
.body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;font-weight:700;border-radius:6px;padding:2px 9px;background:var(--tag-bg);color:var(--muted)}
.tag.subj{background:var(--c);color:#fff}
.card h3{font-size:1.6rem}
.unit{font-size:.88rem;color:var(--muted);margin:-6px 0 0}
.desc{margin:0}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--muted)}
.feat li{display:flex;gap:8px}
.feat li::before{content:"✓";color:var(--c);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95rem;text-decoration:none;border:1.5px solid var(--line);background:transparent}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);flex:1}
.btn:hover{border-color:var(--ink)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:.92rem;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){ .hero{grid-template-columns:1fr;align-items:start} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <div class="brand"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM5 9v10h14V9M10 13h4"/></svg></i>수업자료 아카이브</div>
    <div class="made">Made by Boeun.S</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">교사 연수 공유 자료</div>
      <h1>Claude로 만든 수업자료,<br>바로 실행해 보세요</h1>
      <p>연수에서 함께 살펴본 수업 콘텐츠를 모아 두었습니다. 설치나 로그인 없이 링크만으로 교실에서 바로 쓸 수 있어요.</p>
    </div>
    <aside class="guide" aria-label="사용 방법">
      <h2>우리 반에서 쓰는 법</h2>
      <ol>
        <li><span><b>실행하기</b>로 먼저 직접 해 보기</span></li>
        <li><span><b>링크 복사</b> → 학급 게시판·패들렛에 붙이거나 QR로 띄우기</span></li>
        <li><span>내 GitHub에도 올리고 싶다면 <b>파일 받기</b> 후 업로드</span></li>
      </ol>
    </aside>
  </section>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="과목별 보기"></div>
    <div class="count" id="count"></div>
  </div>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<footer>
  <div class="wrap">
    <span>수업자료 아카이브 · Made by Boeun.S</span>
    <span>자료는 수업 목적으로 자유롭게 활용해 주세요.</span>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   ✏️ 새 자료를 추가하는 방법
   1) 새 HTML 파일을 이 index.html과 같은 위치에 업로드합니다.
   2) 아래 MATERIALS 목록에 { ... } 한 덩어리를 복사해 붙이고 내용을 바꿉니다.
      - file   : 업로드한 파일 이름 (대소문자까지 똑같이)
      - color  : 카드 색 (#으로 시작하는 색 코드)
   3) 수정한 index.html도 다시 업로드하면 목록에 나타납니다.
   ========================================================= */
const MATERIALS = [
  {
    file: 'jiguchon-mailbox.html',
    title: '지구촌 우편함',
    subject: '사회',
    grade: '6학년 2학기',
    unit: '3단원 지구촌 사람들 · 지속가능한 미래를 위한 노력',
    type: '분류 게임',
    color: '#C8402F',
    desc: '지속가능한 미래를 위한 노력이 적힌 엽서를 읽고, 개인·기업·국가·국제기구·비정부 기구 중 알맞은 우편함에 넣는 게임입니다.',
    features: ['혼자 연습 / 모둠 대항전(2~6모둠)', '엽서 수·제한 시간·효과음 설정', '결과 화면에서 주체별 정답률과 틀린 엽서 복습']
  }
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>',
  link: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>'
};

let filter = '전체';

function renderChips(){
  const subjects = ['전체', ...new Set(MATERIALS.map(m => m.subject))];
  $('#chips').innerHTML = subjects.map(s =>
    `<button type="button" data-s="${esc(s)}" aria-pressed="${s === filter}">${esc(s)}</button>`).join('');
}

function renderGrid(){
  const list = MATERIALS.filter(m => filter === '전체' || m.subject === filter);
  $('#count').textContent = `자료 ${list.length}개`;
  if (!list.length){ $('#grid').innerHTML = '<p class="empty">이 과목의 자료는 아직 준비 중이에요.</p>'; return; }
  $('#grid').innerHTML = list.map(m => `
    <article class="card" style="--c:${esc(m.color || '#2F5DA8')}">
      <div class="band"></div>
      <div class="body">
        <div class="meta">
          <span class="tag subj">${esc(m.subject)}</span>
          <span class="tag">${esc(m.grade)}</span>
          ${m.type ? `<span class="tag">${esc(m.type)}</span>` : ''}
        </div>
        <h3>${esc(m.title)}</h3>
        ${m.unit ? `<p class="unit">${esc(m.unit)}</p>` : ''}
        <p class="desc">${esc(m.desc)}</p>
        ${m.features && m.features.length ? `<ul class="feat">${m.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        <div class="btns">
          <a class="btn primary" href="${esc(m.file)}">${ICON.play}실행하기</a>
          <button class="btn" type="button" data-copy="${esc(m.file)}">${ICON.link}링크 복사</button>
          <a class="btn" href="${esc(m.file)}" download>${ICON.down}파일 받기</a>
        </div>
      </div>
    </article>`).join('');
}

let toastT = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

async function copyLink(file){
  const url = new URL(file, location.href).href;
  try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove();
    toast(ok ? '링크를 복사했어요' : url);
  }
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.s; renderChips(); renderGrid();
});
$('#grid').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (b) copyLink(b.dataset.copy);
});

renderChips();
renderGrid();
</script>
</body>
</html>
